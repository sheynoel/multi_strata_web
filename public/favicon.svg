<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <!-- Layer 1 Gradients -->
    <linearGradient id="favL1Center" x1="65" y1="42" x2="135" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="75%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="favL1Right" x1="100" y1="42" x2="170" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="favL1Left" x1="30" y1="25" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="favL1BevelL" x1="30" y1="60" x2="100" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="favL1BevelR" x1="100" y1="60" x2="170" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Layer 2 Gradients -->
    <linearGradient id="favL2Grad" x1="30" y1="59" x2="170" y2="129" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="favL2Bevel" x1="30" y1="94" x2="170" y2="141" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Layer 3 Gradients -->
    <linearGradient id="favL3Grad" x1="30" y1="93" x2="170" y2="163" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="favL3Bevel" x1="30" y1="128" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Layer 4 Gradients -->
    <linearGradient id="favL4Grad" x1="30" y1="127" x2="170" y2="197" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="favL4Bevel" x1="30" y1="162" x2="170" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Soft Filter Glow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#favGlow)">
    <!-- ==================== LAYER 4 (BOTTOM) ==================== -->
    <g id="layer-4">
      <!-- Underside crystal taper -->
      <polygon points="30,174 100,209 100,222" fill="#581c87" opacity="0.9" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
      <polygon points="100,209 170,174 100,222" fill="#7c3aed" opacity="0.9" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
      <!-- Bevel edges -->
      <polygon points="30,162 100,197 100,209 30,174" fill="url(#favL4Bevel)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" />
      <polygon points="100,197 170,162 170,174 100,209" fill="url(#favL4Bevel)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <!-- Top face -->
      <polygon points="100,127 170,162 100,197 30,162" fill="url(#favL4Grad)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <!-- Internal facet lines -->
      <polygon points="100,144 135,162 100,180 65,162" fill="#a855f7" fill-opacity="0.2" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
      <line x1="65" y1="162" x2="30" y2="162" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="135" y1="162" x2="170" y2="162" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="100" y1="144" x2="100" y2="127" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="100" y1="180" x2="100" y2="197" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
    </g>

    <!-- ==================== LAYER 3 (THIRD) ==================== -->
    <g id="layer-3">
      <!-- Bevel edges -->
      <polygon points="30,128 100,163 100,175 30,140" fill="url(#favL3Bevel)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" />
      <polygon points="100,163 170,128 170,140 100,175" fill="url(#favL3Bevel)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <!-- Top face -->
      <polygon points="100,93 170,128 100,163 30,128" fill="url(#favL3Grad)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <!-- Internal facet lines -->
      <polygon points="100,110 135,128 100,146 65,128" fill="#8b5cf6" fill-opacity="0.22" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
      <line x1="65" y1="128" x2="30" y2="128" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="135" y1="128" x2="170" y2="128" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="100" y1="110" x2="100" y2="93" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
      <line x1="100" y1="146" x2="100" y2="163" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
    </g>

    <!-- ==================== LAYER 2 (SECOND) ==================== -->
    <g id="layer-2">
      <!-- Bevel edges -->
      <polygon points="30,94 100,129 100,141 30,106" fill="url(#favL2Bevel)" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" />
      <polygon points="100,129 170,94 170,106 100,141" fill="url(#favL2Bevel)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
      <!-- Top face -->
      <polygon points="100,59 170,94 100,129 30,94" fill="url(#favL2Grad)" stroke="rgba(255,255,255,0.45)" stroke-width="0.8" />
      <!-- Internal facet lines -->
      <polygon points="100,76 135,94 100,112 65,94" fill="#6366f1" fill-opacity="0.25" stroke="rgba(255,255,255,0.35)" stroke-width="0.7" />
      <line x1="65" y1="94" x2="30" y2="94" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
      <line x1="135" y1="94" x2="170" y2="94" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
      <line x1="100" y1="76" x2="100" y2="59" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" />
      <line x1="100" y1="112" x2="100" y2="129" stroke="rgba(255,255,255,0.35)" stroke-width="0.6" />
    </g>

    <!-- ==================== LAYER 1 (TOP FACETED CRYSTAL) ==================== -->
    <g id="layer-1">
      <!-- Bevel edges -->
      <polygon points="30,60 100,95 100,107 30,72" fill="url(#favL1BevelL)" stroke="rgba(255,255,255,0.4)" stroke-width="0.9" />
      <polygon points="100,95 170,60 170,72 100,107" fill="url(#favL1BevelR)" stroke="rgba(255,255,255,0.45)" stroke-width="0.9" />
      <!-- Faceted Outer Top Slices -->
      <polygon points="100,25 65,60 100,42" fill="url(#favL1Left)" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />
      <polygon points="100,25 100,42 135,60" fill="url(#favL1Right)" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />
      <polygon points="100,25 135,60 170,60" fill="#a5f3fc" fill-opacity="0.85" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />
      <polygon points="135,60 170,60 100,78" fill="url(#favL1Right)" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />
      <polygon points="100,78 170,60 100,95" fill="#38bdf8" stroke="rgba(255,255,255,0.6)" stroke-width="0.9" />
      <polygon points="100,78 100,95 65,60" fill="url(#favL1Left)" stroke="rgba(255,255,255,0.6)" stroke-width="0.9" />
      <polygon points="30,60 65,60 100,78" fill="#6366f1" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />
      <polygon points="30,60 100,25 65,60" fill="#818cf8" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" />

      <!-- Luminous Center Table Diamond -->
      <polygon points="100,42 135,60 100,78 65,60" fill="url(#favL1Center)" stroke="rgba(255,255,255,0.85)" stroke-width="1.1" />

      <!-- Center Table Peak Shimmer Highlight -->
      <polygon points="100,42 122,60 100,68 88,60" fill="#ffffff" fill-opacity="0.45" />

      <!-- Front leading edge highlight -->
      <line x1="30" y1="60" x2="100" y2="95" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" />
      <line x1="100" y1="95" x2="170" y2="60" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" />
      <line x1="100" y1="95" x2="100" y2="107" stroke="rgba(255,255,255,0.9)" stroke-width="1.2" />
    </g>
  </g>
</svg>
